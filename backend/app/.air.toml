root = "."
tmp_dir = "tmp"

[build]
  bin = "tmp/main"
  cmd = "go build -o ./tmp/main ."
  delay = 500
  exclude_dir = ["tmp"]
  exclude_regex = ["_test.go"]
  include_ext = ["go"]
  poll = true
  rerun_delay = 500
  log = "build-errors.log"

[log]
  time = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
